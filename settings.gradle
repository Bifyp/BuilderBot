pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://libraries.minecraft.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

// Loom adds local repositories for remapped Minecraft and mod dependencies.
// Keep dependency resolution at project level so those repositories remain visible.
rootProject.name = 'BuilderBot'
